<!DOCTYPE html>

<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:  #FBFBF9;
    --ink:    #1A1C1B;
    --muted:  #636865;
    --soft:   #8B908C;
    --rule:   #DEDFD8;
    --accent: #1E3A5F;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: #EFEFEC;
    color: var(--ink);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  /* block + auto margins, not flex: a flex item will not shrink below the SVG's
     intrinsic width, which clipped the first figure of this set on a phone. */
  .frame { max-width: 1280px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  .colophon {
    margin-top: 1rem; font-family: var(--font-mono); font-size: 0.66rem;

<body>
<div class="frame">

<!-- The title lives inside the SVG on this variant: the PNG export is diagram-only,
     and a slide image has to stand on its own once it is dropped into a deck. -->
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="origins-title origins-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="origins-title">Where SDD4J comes from</title>
  <desc id="origins-desc">Four inherited ideas feed into SDD4J, which is then realised in this Scala 3 project. The inherited ideas are EARS requirement syntax from Alistair Mavin, the Boundary-Control-Entity architecture from Ivar Jacobson, the SBCE workflow from Adam Bien that puts a capability's specification in its package documentation, and JEP 467, which made those doc comments Markdown in JDK 23. SDD4J assembles them into a workflow with stable requirement ids and architecture adapters. This project realises the same contract in Scala 3, where scaladoc on a package clause replaces package-info.java and a requirement id is carried by the name of a munit test.</desc>

  <defs>
    <marker id="org-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#636865"/>
    </marker>
    <marker id="org-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1E3A5F"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FBFBF9"/>

  <!-- ===== title ===== -->
  <text x="64" y="62" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.18em">NOTHING HERE WAS INVENTED FOR THIS PROJECT</text>
  <text x="64" y="106" fill="#1A1C1B" font-size="40" font-weight="500"
        font-family="'Newsreader', Georgia, serif">Where SDD4J comes from</text>

  <!-- ===== connectors, drawn before the nodes ===== -->
  <!-- the four inherited ideas collect on one bus, which carries them into SDD4J -->
  <line x1="280" y1="196" x2="336" y2="196" stroke="#636865" stroke-width="1.4"/>
  <line x1="280" y1="312" x2="336" y2="312" stroke="#636865" stroke-width="1.4"/>
  <line x1="280" y1="428" x2="336" y2="428" stroke="#636865" stroke-width="1.4"/>
  <line x1="280" y1="544" x2="336" y2="544" stroke="#636865" stroke-width="1.4"/>
  <line x1="336" y1="196" x2="336" y2="544" stroke="#636865" stroke-width="1.4"/>
  <line x1="336" y1="370" x2="390" y2="370" stroke="#636865" stroke-width="1.4" marker-end="url(#org-arrow)"/>

  <line x1="640" y1="370" x2="750" y2="370" stroke="#1E3A5F" stroke-width="1.4" marker-end="url(#org-arrow-accent)"/>
  <rect x="663" y="346" width="66" height="16" rx="2" fill="#FBFBF9"/>
  <text x="696" y="358" fill="#1E3A5F" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">BOUND TO</text>

  <!-- ===== column one: what was inherited ===== -->
  <text x="64" y="142" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">INHERITED</text>

  <rect x="64" y="156" width="216" height="80" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <text x="84" y="188" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">EARS</text>
  <text x="84" y="208" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">Alistair Mavin, 2009</text>
  <text x="84" y="226" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">one testable statement</text>

  <rect x="64" y="272" width="216" height="80" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <text x="84" y="304" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">BCE</text>
  <text x="84" y="324" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">Ivar Jacobson, 1992</text>
  <text x="84" y="342" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">boundary/control/entity</text>

  <rect x="64" y="388" width="216" height="80" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <text x="84" y="420" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">SBCE</text>
  <text x="84" y="440" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">Adam Bien</text>
  <text x="84" y="458" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">spec = the package doc</text>

  <rect x="64" y="504" width="216" height="80" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <text x="84" y="536" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">JEP 467</text>
  <text x="84" y="556" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">JDK 23</text>
  <text x="84" y="574" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">Markdown doc comments</text>

  <!-- ===== column two: what SDD4J assembles ===== -->
  <text x="392" y="286" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">ASSEMBLED INTO A WORKFLOW</text>

  <rect x="392" y="300" width="248" height="140" rx="6" fill="#1A1C1B" fill-opacity="0.03"
        stroke="#1A1C1B" stroke-width="1.4"/>
  <text x="412" y="340" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">SDD4J</text>
  <text x="412" y="364" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">soujava/agent-skills</text>
  <text x="412" y="388" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">setup · new · apply · verify</text>
  <text x="412" y="412" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">stable ids R1.1, S1</text>
  <text x="412" y="430" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">architecture adapters</text>

  <!-- ===== column three: what this project realised (focal) ===== -->
  <text x="752" y="256" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">REALISED HERE, IN A LANGUAGE IT WAS NOT WRITTEN FOR</text>

  <rect x="752" y="270" width="464" height="200" rx="6" fill="#1E3A5F" fill-opacity="0.06"
        stroke="#1E3A5F" stroke-width="1.6"/>
  <text x="772" y="310" fill="#1E3A5F" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">Scala 3 + Typelevel</text>
  <text x="772" y="340" fill="#1E3A5F" font-size="12" font-family="'IBM Plex Mono', monospace">package.scala scaladoc, not package-info</text>
  <text x="772" y="366" fill="#1E3A5F" font-size="12" font-family="'IBM Plex Mono', monospace">no JEP 467 needed — scaladoc is Markdown</text>
  <text x="772" y="392" fill="#1E3A5F" font-size="12" font-family="'IBM Plex Mono', monospace">R1.2 is the munit test name's prefix</text>
  <text x="772" y="418" fill="#1E3A5F" font-size="12" font-family="'IBM Plex Mono', monospace">SpecTraceSuite reds the build on drift</text>
  <text x="772" y="444" fill="#1E3A5F" font-size="12" font-family="'IBM Plex Mono', monospace">115 requirements + 3 invariants · 5 BCs</text>

  <!-- ===== the aside ===== -->
  <line x1="64" y1="614" x2="1216" y2="614" stroke="#DEDFD8" stroke-width="1"/>
  <text x="64" y="652" fill="#1A1C1B" font-size="22" font-style="italic"
        font-family="'Newsreader', Georgia, serif">Siblings, not ancestors: OpenSpec and GitHub Spec Kit. SLDD is deliberately unused here — decision D6.</text>

  <!-- ===== footer ===== -->
  <text x="64" y="694" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.12em">SOURCES · FOOJAY.IO · ALISTAIRMAVIN.COM/EARS · ADAMBIEN.BLOG · OPENJDK.ORG/JEPS/467 · GITHUB.COM/SOUJAVA/AGENT-SKILLS</text>
</svg>

  <p class="colophon">
    Slide variant, 1280&times;720. Provenance follows
    <a href="https://foojay.io/today/from-spec-driven-development-to-living-specifications-in-java-projects/">the foojay article</a>,
    with BCE attributed to Jacobson (1992) rather than to its Java popularisation, and JEP 467 confirmed
    against <a href="https://openjdk.org/jeps/467">openjdk.org</a> as final in JDK&nbsp;23.
  </p>
</div>
