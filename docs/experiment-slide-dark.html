<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The storage-swap experiment — slide, dark</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:  #141615;
    --ink:    #F4F4F1;
    --muted:  #9AA09C;
    --soft:   #8A908B;
    --rule:   #2E322F;
    --accent: #6FA0D8;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: #0B0C0C;
    color: var(--ink);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  /* block + auto margins, not flex: a flex item will not shrink below the SVG's
     intrinsic width, which clipped the sibling figure on a phone. */
  .frame { max-width: 1280px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  .colophon {
    margin-top: 1rem; font-family: var(--font-mono); font-size: 0.66rem;
    color: var(--soft); line-height: 1.7;
  }
</style>
</head>
<body>
<div class="frame">

<!-- The title lives inside the SVG on this variant: the PNG export is diagram-only,
     and a slide image has to stand on its own once it is dropped into a deck. -->
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="swap-slide-dark-title swap-slide-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="swap-slide-dark-title">The storage-swap experiment</title>
  <desc id="swap-slide-dark-desc">Three steps run left to right: build the backend on in-memory storage, swap it to PostgreSQL, then re-measure. A reference recorded under the first step, holding a hash of each of the 118 requirement statements and the three outcomes declared in advance, is carried across the slide to the comparison at the bottom. The specifications came through unchanged; three test arrangements did not, and the code grew by 647 lines of implementation and 244 of tests.</desc>

  <defs>
    <marker id="slide-dark-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9AA09C"/>
    </marker>
    <marker id="slide-dark-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6FA0D8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#141615"/>

  <!-- ===== title ===== -->
  <text x="64" y="62" fill="#8A908B" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.18em">SPEC-DRIVEN DEVELOPMENT · EXPERIMENT TWO</text>
  <text x="64" y="106" fill="#F4F4F1" font-size="40" font-weight="500"
        font-family="'Newsreader', Georgia, serif">The storage-swap experiment</text>

  <!-- ===== connectors, drawn before the boxes ===== -->
  <line x1="416" y1="252" x2="456" y2="252" stroke="#9AA09C" stroke-width="1.4" marker-end="url(#slide-dark-arrow)"/>
  <line x1="816" y1="252" x2="856" y2="252" stroke="#9AA09C" stroke-width="1.4" marker-end="url(#slide-dark-arrow)"/>
  <line x1="240" y1="328" x2="240" y2="368" stroke="#6FA0D8" stroke-width="1.4" marker-end="url(#slide-dark-arrow-accent)"/>

  <!-- the reference, carried across the slide to the comparison -->
  <path d="M 240 456 V 484 Q 240 492 248 492 H 1132 Q 1140 492 1140 500 V 512"
        fill="none" stroke="#6FA0D8" stroke-width="1.4" marker-end="url(#slide-dark-arrow-accent)"/>
  <rect x="646" y="466" width="88" height="16" rx="2" fill="#141615"/>
  <text x="690" y="478" fill="#6FA0D8" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">BASELINE</text>

  <!-- ===== 01 ===== -->
  <rect x="64" y="176" width="352" height="152" rx="6" fill="#141615"/>
  <rect x="64" y="176" width="352" height="152" rx="6" fill="#242724" stroke="#F4F4F1" stroke-width="1.2"/>
  <rect x="80" y="192" width="28" height="16" rx="2" fill="none" stroke="#F4F4F1" stroke-opacity="0.40" stroke-width="0.9"/>
  <text x="94" y="204" fill="#F4F4F1" fill-opacity="0.8" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">01</text>
  <text x="240" y="244" fill="#F4F4F1" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Build on in-memory storage</text>
  <text x="240" y="276" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">decision D3 · Ref-backed · 5 components</text>
  <text x="240" y="300" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">118 statements · 120 tests</text>

  <!-- ===== 02 ===== -->
  <rect x="464" y="176" width="352" height="152" rx="6" fill="#141615"/>
  <rect x="464" y="176" width="352" height="152" rx="6" fill="#242724" stroke="#F4F4F1" stroke-width="1.2"/>
  <rect x="480" y="192" width="28" height="16" rx="2" fill="none" stroke="#F4F4F1" stroke-opacity="0.40" stroke-width="0.9"/>
  <text x="494" y="204" fill="#F4F4F1" fill-opacity="0.8" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">02</text>
  <text x="640" y="244" fill="#F4F4F1" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Swap to PostgreSQL</text>
  <text x="640" y="276" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">decision D11 · Skunk</text>
  <text x="640" y="300" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">one capability at a time, smallest first</text>

  <!-- ===== 03 ===== -->
  <rect x="864" y="176" width="352" height="152" rx="6" fill="#141615"/>
  <rect x="864" y="176" width="352" height="152" rx="6" fill="#242724" stroke="#F4F4F1" stroke-width="1.2"/>
  <rect x="880" y="192" width="28" height="16" rx="2" fill="none" stroke="#F4F4F1" stroke-opacity="0.40" stroke-width="0.9"/>
  <text x="894" y="204" fill="#F4F4F1" fill-opacity="0.8" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">03</text>
  <text x="1040" y="244" fill="#F4F4F1" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Re-measure</text>
  <text x="1040" y="276" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">122 tests · Hurl 13/13</text>
  <text x="1040" y="300" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">sbt test 4s → 8s</text>

  <!-- ===== the reference (focal) ===== -->
  <rect x="64" y="368" width="352" height="88" rx="6" fill="#141615"/>
  <rect x="64" y="368" width="352" height="88" rx="6" fill="#6FA0D8" fill-opacity="0.10"
        stroke="#6FA0D8" stroke-width="1.2"/>
  <rect x="80" y="384" width="36" height="16" rx="2" fill="none" stroke="#6FA0D8" stroke-opacity="0.45" stroke-width="0.9"/>
  <text x="98" y="396" fill="#6FA0D8" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">REF</text>
  <text x="240" y="418" fill="#F4F4F1" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Record the reference</text>
  <text x="240" y="440" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">118 statement hashes · 3 outcomes declared</text>

  <!-- ===== the comparison ===== -->
  <rect x="64" y="512" width="1152" height="144" rx="6" fill="#141615"/>
  <rect x="64" y="512" width="1152" height="144" rx="6" fill="#242724" stroke="#F4F4F1" stroke-width="1.2"/>
  <text x="88" y="540" fill="#8A908B" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">COMPARED AGAINST THE REFERENCE</text>
  <line x1="448" y1="556" x2="448" y2="632" stroke="#2E322F" stroke-width="1"/>
  <line x1="832" y1="556" x2="832" y2="632" stroke="#2E322F" stroke-width="1"/>

  <text x="88" y="588" fill="#6FA0D8" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">Specs neutral</text>
  <text x="88" y="616" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace">0 of 118 statements changed</text>
  <text x="88" y="638" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace">0 assertions modified</text>

  <text x="472" y="588" fill="#F4F4F1" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">Tests leaked</text>
  <text x="472" y="616" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace">3 arrangements rewritten</text>
  <text x="472" y="638" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace">the specs held, the test strategy did not</text>

  <text x="856" y="588" fill="#F4F4F1" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">Code grew</text>
  <text x="856" y="616" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace">main  +647 / -45 lines</text>
  <text x="856" y="638" fill="#9AA09C" font-size="12" font-family="'IBM Plex Mono', monospace">tests +244 / -56 lines</text>

  <!-- ===== footer ===== -->
  <text x="64" y="694" fill="#8A908B" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.12em">REALWORLD BACKEND · SCALA 3 + TYPELEVEL · SDD4J</text>
</svg>

  <p class="colophon">
    Dark slide variant, 1280&times;720. Light version: <code>docs/experiment-slide.html</code>.
  </p>
</div>
</body>
</html>
