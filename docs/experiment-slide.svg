<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="swap-slide-title swap-slide-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="swap-slide-title">The storage-swap experiment</title>
  <desc id="swap-slide-desc">Three steps run left to right: build the backend on in-memory storage, swap it to PostgreSQL, then re-measure. A reference recorded under the first step, holding a hash of each of the 118 requirement statements and the three outcomes declared in advance, is carried across the slide to the comparison at the bottom. The specifications came through unchanged; three test arrangements did not.</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,1,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="slide-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#636865"/>
    </marker>
    <marker id="slide-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1E3A5F"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FBFBF9"/>

  <!-- ===== title ===== -->
  <text x="64" y="62" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.18em">SPEC-DRIVEN DEVELOPMENT · EXPERIMENT TWO</text>
  <text x="64" y="106" fill="#1A1C1B" font-size="40" font-weight="500"
        font-family="'Newsreader', Georgia, serif">The storage-swap experiment</text>

  <!-- ===== connectors, drawn before the boxes ===== -->
  <line x1="416" y1="252" x2="456" y2="252" stroke="#636865" stroke-width="1.4" marker-end="url(#slide-arrow)"/>
  <line x1="816" y1="252" x2="856" y2="252" stroke="#636865" stroke-width="1.4" marker-end="url(#slide-arrow)"/>
  <line x1="240" y1="328" x2="240" y2="368" stroke="#1E3A5F" stroke-width="1.4" marker-end="url(#slide-arrow-accent)"/>

  <!-- the reference, carried across the slide to the comparison -->
  <path d="M 240 456 V 484 Q 240 492 248 492 H 1132 Q 1140 492 1140 500 V 512"
        fill="none" stroke="#1E3A5F" stroke-width="1.4" marker-end="url(#slide-arrow-accent)"/>
  <rect x="646" y="466" width="88" height="16" rx="2" fill="#FBFBF9"/>
  <text x="690" y="478" fill="#1E3A5F" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.10em">BASELINE</text>

  <!-- ===== 01 ===== -->
  <rect x="64" y="176" width="352" height="152" rx="6" fill="#FBFBF9"/>
  <rect x="64" y="176" width="352" height="152" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <rect x="80" y="192" width="28" height="16" rx="2" fill="none" stroke="#1A1C1B" stroke-opacity="0.40" stroke-width="0.9"/>
  <text x="94" y="204" fill="#1A1C1B" fill-opacity="0.8" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">01</text>
  <text x="240" y="244" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Build on in-memory storage</text>
  <text x="240" y="276" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">decision D3 · Ref-backed · 5 components</text>
  <text x="240" y="300" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">118 statements · 120 tests</text>

  <!-- ===== 02 ===== -->
  <rect x="464" y="176" width="352" height="152" rx="6" fill="#FBFBF9"/>
  <rect x="464" y="176" width="352" height="152" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <rect x="480" y="192" width="28" height="16" rx="2" fill="none" stroke="#1A1C1B" stroke-opacity="0.40" stroke-width="0.9"/>
  <text x="494" y="204" fill="#1A1C1B" fill-opacity="0.8" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">02</text>
  <text x="640" y="244" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Swap to PostgreSQL</text>
  <text x="640" y="276" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">decision D11 · Skunk</text>
  <text x="640" y="300" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">one capability at a time, smallest first</text>

  <!-- ===== 03 ===== -->
  <rect x="864" y="176" width="352" height="152" rx="6" fill="#FBFBF9"/>
  <rect x="864" y="176" width="352" height="152" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <rect x="880" y="192" width="28" height="16" rx="2" fill="none" stroke="#1A1C1B" stroke-opacity="0.40" stroke-width="0.9"/>
  <text x="894" y="204" fill="#1A1C1B" fill-opacity="0.8" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">03</text>
  <text x="1040" y="244" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Re-measure</text>
  <text x="1040" y="276" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">122 tests · Hurl 13/13</text>
  <text x="1040" y="300" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">sbt test 4s → 8s</text>

  <!-- ===== the reference (focal) ===== -->
  <rect x="64" y="368" width="352" height="88" rx="6" fill="#FBFBF9"/>
  <rect x="64" y="368" width="352" height="88" rx="6" fill="#1E3A5F" fill-opacity="0.06"
        stroke="#1E3A5F" stroke-width="1.2"/>
  <rect x="80" y="384" width="36" height="16" rx="2" fill="none" stroke="#1E3A5F" stroke-opacity="0.45" stroke-width="0.9"/>
  <text x="98" y="396" fill="#1E3A5F" font-size="8" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle" letter-spacing="0.08em">REF</text>
  <text x="240" y="418" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Record the reference</text>
  <text x="240" y="440" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace"
        text-anchor="middle">118 statement hashes · 3 outcomes declared</text>

  <!-- ===== the comparison ===== -->
  <rect x="64" y="512" width="1152" height="144" rx="6" fill="#FBFBF9"/>
  <rect x="64" y="512" width="1152" height="144" rx="6" fill="#FFFFFF" stroke="#1A1C1B" stroke-width="1.2"/>
  <text x="88" y="540" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.14em">COMPARED AGAINST THE REFERENCE</text>
  <line x1="640" y1="556" x2="640" y2="632" stroke="#DEDFD8" stroke-width="1"/>

  <text x="88" y="588" fill="#1E3A5F" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">Specs neutral</text>
  <text x="88" y="616" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">0 of 118 statements changed</text>
  <text x="88" y="638" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">0 assertions modified</text>

  <text x="672" y="588" fill="#1A1C1B" font-size="16" font-weight="600"
        font-family="'IBM Plex Sans', sans-serif">Tests leaked</text>
  <text x="672" y="616" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">3 arrangements rewritten</text>
  <text x="672" y="638" fill="#636865" font-size="12" font-family="'IBM Plex Mono', monospace">the specs held, the test strategy did not</text>

  <!-- ===== footer ===== -->
  <text x="64" y="694" fill="#8B908C" font-size="8" font-family="'IBM Plex Mono', monospace"
        letter-spacing="0.12em">REALWORLD BACKEND · SCALA 3 + TYPELEVEL · SDD4J</text>
</svg>
